<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Account Security Bypass™</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .google-logo { width: 90px; margin-bottom: 20px; }

        .terms-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; }
        .disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
    </style>
</head>
<body>
    <div class="card">

        <h2 style="color: #fff; margin-top: 0;">AbsoluteNoScam™ <span style="font-size: 0.5em; vertical-align: top;">SUS</span></h2>
        
        <div class="warning-box">
            This tool bypasses Google security protocols to unlock hidden developer features. 
            <strong>Note:</strong> This only works when executed on <u>google.com</u>.
        </div>

        <label class="terms-label">
            <input type="checkbox" id="terms"> I accept AbsoluteNoScam™ Terms of Service.
        </label>

        <div id="btnContainer" class="disabled">
            <p style="font-size: 0.8rem; color: var(--primary);">Drag the button to your Bookmarks bar:</p>
            <a id="payloadBtn" href="" class="main-btn">ENABLE GOOGLE EXPLOIT</a>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
