<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Exploit™</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .google-logo { width: 90px; margin-bottom: 20px; }
        .warning-box { border: 1px solid #333; padding: 15px; margin: 20px 0; font-size: 0.85rem; background: #050505; color: #888; }
        .terms-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; margin-bottom: 20px; }
        #btnContainer.locked { opacity: 0.3; pointer-events: none; }
        .main-btn { display: inline-block; text-decoration: none; cursor: move; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_92x30dp.png" class="google-logo">
        <h2>AbsoluteNoScam™ <span style="font-size: 0.5em;">SUS</span></h2>
        <div class="warning-box">Drag the button below to your bookmarks bar. Use only on google.com.</div>
        
        <label class="terms-label">
            <input type="checkbox" id="terms"> I accept the terms.
        </label>

        <div id="btnContainer" class="locked">
            <a id="payloadBtn" href="#" class="main-btn">DRAG TO BOOKMARKS</a>
        </div>
    </div>
    <script src="/bookmarklets/scripts.js"></script>
</body>
</html>
